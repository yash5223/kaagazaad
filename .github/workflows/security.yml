name: security
on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # weekly, catches advisories published after the last push
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: 20, cache: npm}
      - run: npm ci --omit=dev
      - name: Fail on high/critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax check
        run: for f in server.js middleware/*.js routes/*.js utils/*.js models/*.js; do node --check "$f"; done
